services:
  app:
    build: .
    # Plain published port, NOT `network_mode: host`. Host networking was
    # tried (2026-09-23) on the theory that Docker Desktop's port-forwarding
    # proxy was dropping the robot's WebSocket; it wasn't -- the real cause
    # was internal-RAM exhaustion on the ESP32 (see esp32-firmware's
    # sdkconfig.defaults, CONFIG_CAMERA_PSRAM_DMA). Host networking also
    # depends on Docker Desktop's beta "Enable host networking" toggle
    # (Resources -> Network), which was found switched off after a Docker
    # Desktop restart on 2026-09-24: the server kept running but was
    # unreachable from the LAN (robot got "Connection reset by peer").
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      # .env is shared with the native server (haroctl), which runs Pocket
      # TTS in fp32; inside Docker's Linux VM int8 is the fast one -- see
      # PocketTtsEngine's docstring.
      POCKETTTS_QUANTIZE: "true"
    restart: unless-stopped
    volumes:
      # Model weights are multi-GB and downloaded on first use, not baked
      # into the image: Kokoro pulls hexgrad/Kokoro-82M and Parakeet pulls a
      # ~2.3GB .nemo checkpoint, both into the HuggingFace Hub cache (Task
      # 7's real-model run confirmed NeMo lands at
      # ~/.cache/huggingface/hub/models--nvidia--parakeet-tdt-0.6b-v3).
      # Without this volume every container recreate re-downloads them and
      # pays the cold-load cost again. The Dockerfile has no USER
      # directive, so HOME inside the container is /root.
      - model_cache:/root/.cache/huggingface
      # DB_PATH (db.py's SQLite file: transcripts, long-term memory, the
      # admin-editable system prompt) needs the same treatment -- without
      # this volume, a container recreate (docker-compose up --build after
      # a code change) silently wipes all of it, same as the model cache
      # would without model_cache above. Set DB_PATH=/app/data/haro.db in
      # .env for this to actually land inside the volume.
      - db_data:/app/data
      # Google Calendar accounts config (google_calendar_accounts.json,
      # listing every account by label) plus one OAuth token per account
      # (tools/setup_google_calendar.py's output) -- all gitignored, see
      # .gitignore's comment. Bind-mounted (not a named volume like the two
      # above) since these are host-managed files the user re-generates by
      # re-running that script per account, not container-owned state.
      # Read-only: the server only ever reads them (google-auth refreshes
      # each account's access token in memory using its own long-lived
      # refresh token; nothing here writes the files back).
      # GOOGLE_CALENDAR_ACCOUNTS_PATH in .env must match the accounts file's
      # container-side path below, and every credentials_path inside that
      # JSON file must match one of the token mounts below -- add a new
      # mount line here for each new account (see tools/setup_google_
      # calendar.py's own docstring for how to produce a new account's
      # token file).
      - ./google_calendar_accounts.json:/app/google_calendar_accounts.json:ro
      - ./google_calendar_token_personale.json:/app/google_calendar_token_personale.json:ro
      - ./google_calendar_token_lavoro.json:/app/google_calendar_token_lavoro.json:ro
      - ./google_calendar_token_lavoro2.json:/app/google_calendar_token_lavoro2.json:ro
      # Cloned TTS voices: POCKETTTS_VOICE=<name> in .env picks
      # voices/<name>.wav (pockettts_tts.py's resolve_voice()). Drop a new
      # 10-30s clean mono WAV here to add a voice, then restart the server.
      - ./voices:/app/voices:ro

volumes:
  model_cache:
  db_data:

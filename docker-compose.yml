services:
  app:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Model weights are multi-GB and downloaded on first use, not baked
      # into the image: Kokoro pulls hexgrad/Kokoro-82M and Parakeet pulls a
      # ~2.3GB .nemo checkpoint, both into the HuggingFace Hub cache (Task
      # 7's real-model run confirmed NeMo lands at
      # ~/.cache/huggingface/hub/models--nvidia--parakeet-tdt-0.6b-v3).
      # Without this volume every container recreate re-downloads them and
      # pays the cold-load cost again. The Dockerfile has no USER
      # directive, so HOME inside the container is /root.
      - model_cache:/root/.cache/huggingface
      # DB_PATH (db.py's SQLite file: transcripts, long-term memory, the
      # admin-editable system prompt) needs the same treatment -- without
      # this volume, a container recreate (docker-compose up --build after
      # a code change) silently wipes all of it, same as the model cache
      # would without model_cache above. Set DB_PATH=/app/data/haro.db in
      # .env for this to actually land inside the volume.
      - db_data:/app/data

volumes:
  model_cache:
  db_data:

[project]
name = "haro-server"
version = "0.1.0"
description = "AI backend server for the Haro personal desk robot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=12.0",
    "litellm>=1.50.0",
    # Pinned exactly: kokoro releases after 0.7.4 require a matching
    # `misaki` version that PyPI has never published (misaki tops out at
    # 0.7.4), so anything newer is currently uninstallable. 0.7.4 is the
    # latest resolvable release and is the version this adapter was
    # verified against (see tts.py).
    "kokoro==0.7.4",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
